# Qirop School ERP — API on its own subdomain (frontend stays on Vercel).
# Browsers call https://api.qiropschool.com/api/... directly instead of going
# through Vercel's /api rewrite, whose route to this VPS dropped connections.
#
#   sudo cp nginx-api.conf /etc/nginx/sites-available/akm-api
#   sudo ln -s /etc/nginx/sites-available/akm-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.qiropschool.com     (adds TLS + http→https redirect)
#
# The app sets `trust proxy` to loopback, so req.ip (login rate limit, logs)
# comes from X-Forwarded-For set here rather than being 127.0.0.1 for everyone.

server {
    listen 80;
    server_name api.qiropschool.com;

    client_max_body_size 20m; # multer allows 15 MB per file

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # report compiles / PDF generation
    }
}
